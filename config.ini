[meshtastic]
host = 192.168.1.95
port = 4403
channel = 0

[rch]
rest_url = http://localhost:8000
api_token = change-me
identity = default
auth_mode = none
timeout_seconds = 5.0

[mapping]
topic_path_template = meshtastic.channel.{channel}
topic_name_template = Meshtastic Channel {channel}
marker_type = meshtastic_node
marker_symbol = map-marker-account
marker_category = mdi
marker_name_template = {long_name|short_name|node_id}
node_tag_prefix = meshtastic_node_id=

[runtime]
pid_file = .runtime/bridge.pid
status_file = .runtime/status.json
reconnect_max_seconds = 60

[general]
log_level = INFO

