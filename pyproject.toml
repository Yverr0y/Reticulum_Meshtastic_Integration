[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "rch-mesh-bridge"
version = "0.1.0"
description = "Meshtastic to Reticulum Community Hub ingestion bridge."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "EPL-2.0" }
authors = [
  { name = "FreeTAKTeam" }
]
dependencies = [
  "httpx>=0.27,<1.0",
  "meshtastic>=2.6.0,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.23,<1.0",
]

[project.scripts]
rch-mesh-bridge = "rch_mesh_bridge.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

